name: DG_Renew
on:
  schedule:
    - cron: 55 1 11 11 *
  workflow_dispatch: null
permissions:
  contents: write
  actions: write
env:
  TOKENS: ${{ vars.DG_TOKENS }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check accounts & update cron
        id: schedule
        run: |
          set -e
          echo ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }} >upload/scope.txt
          # 1. 检查 accounts
          ACCOUNTS=$(curl -sS "https://dg.str.xx.kg/?accounts")
          echo "accounts = $ACCOUNTS"

          if [ "$ACCOUNTS" = "0" ]; then
            echo "未检测到有效账号，跳过更新。"
            echo "skip_python=true" >> $GITHUB_OUTPUT
          else
            echo "获取账号：$ACCOUNTS"
            echo "ACCOUNTS=$ACCOUNTS" >> $GITHUB_ENV
            echo "skip_python=false" >> $GITHUB_OUTPUT
          fi

          # 2. 获取 recent 的 日 月
          RECENT=$(curl -sS "https://dg.str.xx.kg/?recent")
          echo "recent = $RECENT"

          # 假设返回格式是 "15 11"（日 月），或包含这两个数字
          # 下面用 awk 提取前两个数字作为 日 和 月
          DAY=$(echo "$RECENT" | awk '{print $1}')
          MONTH=$(echo "$RECENT" | awk '{print $2}')

          # 如果你希望固定 时:分（比如 8:55），可以写死
          MINUTE=55
          HOUR=1

          CRON="$MINUTE $HOUR $DAY $MONTH *"
          echo "New cron: $CRON"
          echo "cron=$CRON" >> $GITHUB_OUTPUT
      - name: Run Python script (only when accounts != 0)
        if: steps.schedule.outputs.skip_python != 'true'
        run: |
          pip3 install requests
          python3 dg_renew.py
          # 或者直接写业务逻辑
      - name: 自动提交文件到仓库的 upload 目录
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "测试文件上传"
          # 指定只提交 upload 文件夹下的内容
          file_pattern: 'upload/*'
          # 如果对应的文件没有发生任何变化，自动跳过而不报错
          skip_dirty_check: false      
          
      - name: Update cron schedule
        uses: gr2m/set-cron-schedule-action@v2
        with:
          token: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
          cron: ${{ steps.schedule.outputs.cron }}
          message: "ci: update cron from recent → ${{ steps.schedule.outputs.cron }}"
      
